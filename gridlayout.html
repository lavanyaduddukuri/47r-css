<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
        display: grid;
        grid-template-columns: repeat(4, 1fr);    
        gap: 10px; 
        border: 4px solid gray;
        width: 100%;
        height: 100vh;
        padding: 10px;
        }
        .parent div {
        background: rgb(173, 31, 31);
        }
        .item1 {
            grid-column: 1 / 2; 
            grid-row: 1 / 2;
        }
        .item2 {
            grid-column: 2 / 3; 
            grid-row: 1 / 2;
        }
        .item3 {
            grid-column: 3 / 4; 
            grid-row: 1 / 2;
        }
        .item4 {
            grid-column: 4 / 5; 
            grid-row: 1 / 2;
        }

        .item5 {
            grid-column: 1 / 3; 
            grid-row: 2 / 3;
        }
        .item6 {
            grid-column: 2 / 3; 
            grid-row: 2 / 3;
        }
        .item7 {
            grid-column: 3 / 5; 
            grid-row: 2 / 3;
        }
        .item8 {
            grid-column: 4 / 5; 
            grid-row: 2 / 3;
        }

        .item9 {
            grid-column: 1 / 2; 
            grid-row: 3 / 4;
        }
        .item10 {
            grid-column: 2 / 3; 
            grid-row: 3 / 4;
        }
        .item11 {
            grid-column: 3 / 4; 
            grid-row: 3 / 4;
        }
        .item12 {
            grid-column: 4 / 5; 
            grid-row: 3 / 4;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="item7"></div>
        <div class="item8"></div>
        <div class="item9"></div>
        <div class="item10"></div>
        <div class="item11"></div>
        <div class="item12"></div>
    </div>
</body>
</html>
